name: Tests

# Runs the three test suites (CLAUDE.md "Tests") on every pull request and on
# every push to main, so a change that breaks a test is seen before it merges.
#
# The fork's browser tests (tests/e2e/*.mjs) each start their own server on a
# fixed port, often the same port as another file, so they cannot run side by
# side on one machine. Each e2e job runs its share of the files one at a time;
# the shards run on separate machines.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Node and browser unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Node tests (tests/test-*.mjs)
        run: node tests/run-mjs-tests.mjs
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      # Every browser test launches Google Chrome (GitHub's Ubuntu runners have
      # it), not Playwright's own Chromium: on Linux that build's renderer
      # crashed mid-test (slp-failed-read here; on talmolab's CI,
      # export-bycam-store-copy), and Chrome is the browser people use. The
      # tests call chromium.launch themselves, so a module loaded before each
      # one adds the channel to every launch that names no browser.
      - name: Use Google Chrome for the browser tests
        run: |
          cat > "$RUNNER_TEMP/use-chrome.mjs" <<'EOF'
          import { createRequire } from 'node:module';
          const { chromium } = createRequire(process.env.GITHUB_WORKSPACE + '/tests/e2e/package.json')('playwright');
          const withChrome = (o) => (o && (o.channel || o.executablePath)) ? o : Object.assign({}, o, { channel: 'chrome' });
          const launch = chromium.launch.bind(chromium), persistent = chromium.launchPersistentContext.bind(chromium);
          chromium.launch = (o) => launch(withChrome(o));
          chromium.launchPersistentContext = (dir, o) => persistent(dir, withChrome(o));
          EOF
          echo "NODE_OPTIONS=--import=file://$RUNNER_TEMP/use-chrome.mjs" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Browser unit tests (tests/*.js via tests/test-runner.html)
        run: node tests/e2e/run-unit-tests.mjs

  e2e:
    name: e2e ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SHARDS: 6
      SHARD: ${{ matrix.shard }}
      # The three files that use a server they did not start read it here.
      BASE: http://localhost:8431
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          echo "PLAYWRIGHT_VERSION=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_ENV"
      - name: Cache Playwright's browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # ffmpeg (libx264) builds the test videos of a few files, which skip
      # without it.
      - name: Install Chromium, its system libraries and ffmpeg
        working-directory: tests/e2e
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      # Every browser test launches Google Chrome (GitHub's Ubuntu runners have
      # it), not Playwright's own Chromium: on Linux that build's renderer
      # crashed mid-test (slp-failed-read here; on talmolab's CI,
      # export-bycam-store-copy), and Chrome is the browser people use. The
      # tests call chromium.launch themselves, so a module loaded before each
      # one adds the channel to every launch that names no browser.
      - name: Use Google Chrome for the browser tests
        run: |
          cat > "$RUNNER_TEMP/use-chrome.mjs" <<'EOF'
          import { createRequire } from 'node:module';
          const { chromium } = createRequire(process.env.GITHUB_WORKSPACE + '/tests/e2e/package.json')('playwright');
          const withChrome = (o) => (o && (o.channel || o.executablePath)) ? o : Object.assign({}, o, { channel: 'chrome' });
          const launch = chromium.launch.bind(chromium), persistent = chromium.launchPersistentContext.bind(chromium);
          chromium.launch = (o) => launch(withChrome(o));
          chromium.launchPersistentContext = (dir, o) => persistent(dir, withChrome(o));
          EOF
          echo "NODE_OPTIONS=--import=file://$RUNNER_TEMP/use-chrome.mjs" >> "$GITHUB_ENV"
          google-chrome --version
      # So offline-server.mjs runs instead of skipping.
      - name: Install the offline packages
        run: python3 scripts/offline_deps.py install
      - name: e2e tests, shard ${{ matrix.shard }} of 6
        run: |
          python3 -m http.server 8431 --bind 127.0.0.1 > /dev/null 2>&1 &
          LOGS="$RUNNER_TEMP/e2e-logs"; mkdir -p "$LOGS"
          # Every browser test (files starting with "_" are investigation
          # tools; run-unit-tests.mjs runs in the unit job), in name order,
          # every SHARDS-th one.
          FILES=(); i=0
          while read -r f; do
            if (( i % SHARDS == SHARD - 1 )); then FILES+=("$f"); fi
            i=$((i + 1))
          done < <(ls tests/e2e/[a-z]*.mjs | grep -v '/run-unit-tests\.mjs$' | LC_ALL=C sort)
          echo "${#FILES[@]} of $i files"
          run() {  # file, log -> "exit-status seconds"; 15 minutes at most
            local t0=$SECONDS s=0
            timeout -k 10 900 node "$1" > "$2" 2>&1 || s=$?
            echo "$s $((SECONDS - t0))"
          }
          PASSED=0; SKIPPED=(); FLAKY=(); FAILED=()
          for f in "${FILES[@]}"; do
            n=$(basename "$f" .mjs)
            read -r s secs < <(run "$f" "$LOGS/$n.log")
            if [ "$s" = 0 ]; then
              if grep -q '^SKIP' "$LOGS/$n.log"; then SKIPPED+=("$n"); echo "SKIP  $n (${secs} s): $(grep -m1 '^SKIP' "$LOGS/$n.log")"
              else PASSED=$((PASSED + 1)); echo "ok    $n (${secs} s)"; fi
              continue
            fi
            # A failure is run again once before it counts.
            echo "fail  $n (${secs} s, exit $s); running it again"
            read -r s2 secs2 < <(run "$f" "$LOGS/$n.rerun.log")
            if [ "$s2" = 0 ]; then FLAKY+=("$n"); echo "ok    $n on the second run (${secs2} s)"
            else FAILED+=("$n"); echo "FAIL  $n (exit $s2)"; echo "::group::$n output"; tail -n 60 "$LOGS/$n.rerun.log"; echo "::endgroup::"; fi
          done
          echo
          echo "$PASSED passed, ${#FLAKY[@]} passed on a second run, ${#SKIPPED[@]} skipped, ${#FAILED[@]} failed"
          [ ${#FLAKY[@]} -gt 0 ] && echo "passed on a second run: ${FLAKY[*]}"
          [ ${#SKIPPED[@]} -gt 0 ] && echo "skipped: ${SKIPPED[*]}"
          if [ ${#FAILED[@]} -gt 0 ]; then echo "failed: ${FAILED[*]}"; exit 1; fi
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7
